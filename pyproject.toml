[build-system]
requires = ["setuptools>=70"]
build-backend = "setuptools.build_meta"

[project]
name = "kalshi-mispricing-arbitrage-engine"
version = "0.1.0"
description = "A test-first structural mispricing research engine for Kalshi"
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
    "aiosqlite>=0.20,<1",
    "cryptography>=42,<47",
    "httpx>=0.27,<1",
    "pydantic>=2.5,<3",
    "python-dotenv>=1,<2",
    "structlog>=24.1,<26",
    "websockets>=15,<16",
]

[project.optional-dependencies]
dev = [
    "pytest>=8,<10",
    "pytest-asyncio>=0.24,<2",
]

[project.scripts]
kalshi-markets = "kalshi_client.cli:main"
kalshi-engine = "src.cli:main"

[tool.pytest.ini_options]
addopts = "-ra"
testpaths = ["tests"]

[tool.setuptools.packages.find]
include = ["kalshi_client*", "src*"]
